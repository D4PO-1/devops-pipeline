name: My First DevOps Pipeline
 
# Run this robot pipeline every time code is pushed to Github
on:
  push:
    branches: [ "main" ]
 
jobs:
  test-and-build:
    runs-on: ubuntu-latest
 
    steps:
    # Step 1: Download the code onto the GitHub robot computer
    - name: Checkout code
      uses: actions/checkout@v4
 
    # Step 2: Set up Python on the robot computer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-with: '3.10'
 
    # Step 3: Test if the Python code has any obvious typing errors
    - name: Install Flask & Test syntax
      run: |
        pip install flask redis
        python -m py_compile app.py
 
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: dxpo/my-first-devops-pipeline:latest
    